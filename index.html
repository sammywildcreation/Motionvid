    <script>
      const tl = gsap.timeline({ paused: true });
      const W = 1920,
        H = 1080;

      // ---------------------------------------------------------------- HOOK
      tl.fromTo("#lock", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.25);
      tl.fromTo("#notif", { opacity: 0, y: -120, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, T.notify);
      // dive: lock screen falls away as the camera rushes into the pages
      tl.to("#lock", { opacity: 0, scale: 1.6, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, T.flight - 0.1);
      tl.to("#notif", { opacity: 0, scale: 1.8, y: 120, filter: "blur(10px)", duration: 0.5, ease: "power2.in" }, T.flight - 0.1);

      // a deterministic corridor of real pages
      const fworld = document.getElementById("fworld");
      const NP = 18,
        GAP = 620;
      for (let i = 0; i < NP; i++) {
        const p = document.createElement("div");
        p.className = "page";
        const side = i % 2 ? 1 : -1;
        const x = side * (300 + ((i * 97) % 220));
        const y = ((i * 53) % 260) - 130;
        const rz = side * (4 + ((i * 31) % 9));
        const ry = -side * (18 + ((i * 17) % 14));
        p.style.transform = `translate3d(${x}px, ${y}px, ${-i * GAP - 400}px) rotateY(${ry}deg) rotateZ(${rz}deg)`;
        fworld.appendChild(p);
      }
      tl.fromTo("#flight", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, T.flight);
      tl.fromTo(fworld, { z: -300 }, { z: NP * GAP + 200, duration: T.oneNight - T.flight, ease: "power2.in" }, T.flight);
      tl.to("#flight", { opacity: 0, duration: 0.12, ease: "none" }, T.oneNight - 0.12);
      const pnum = document.getElementById("pnum");
      const pc = { v: 1 };
      tl.fromTo("#pcount", { opacity: 0 }, { opacity: 1, duration: 0.3 }, T.flight + 0.2);
      tl.fromTo(
        pc,
        { v: 1 },
        {
          v: 192,
          duration: T.oneNight - T.flight - 0.5,
          ease: "power2.in",
          onUpdate: () => {
            pnum.textContent = String(Math.round(pc.v));
          },
        },
        T.flight + 0.2
      );
      tl.to("#pcount", { opacity: 0, duration: 0.12 }, T.oneNight - 0.12);

      // "One night."
      tl.fromTo("#night-w", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, T.oneNight);
      tl.to("#night-w", { opacity: 0, y: -40, duration: 0.25, ease: "power2.in" }, T.question - 0.3);

      // "What if you didn't have to read all of it... to understand all of it?" — words land with the voice
      const Q1 = ["What", "if", "you", "didn't", "have", "to", "read", "all", "of", "it"];
      const Q2 = ["to", "understand", "all", "of", "it?"];
      const q1 = document.getElementById("q1"),
        q2 = document.getElementById("q2");
      Q1.forEach((w, i) => {
        const s = document.createElement("span");
        s.className = "w";
        s.textContent = w;
        q1.appendChild(s);
        if (w === "didn't") {
          const br = document.createElement("span");
          br.style.cssText = "display:block;flex-basis:100%;height:0";
          q1.appendChild(br);
        }
        tl.fromTo(s, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, T.question + 0.02 + i * 0.165);
      });
      Q2.forEach((w, i) => {
        const s = document.createElement("span");
        s.className = "w" + (w === "understand" ? " o" : "");
        s.textContent = w;
        q2.appendChild(s);
        tl.fromTo(s, { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, T.question + 2.0 + i * 0.22);
      });
      tl.fromTo(["#q1", "#q2"], { scale: 1 }, { scale: 1.05, duration: 3.4, ease: "none" }, T.question);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in" }, T.reveal - 0.12);

      // ---------------------------------------------------------------- BRAND
      tl.fromTo("#b-glow", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.6, duration: 0.9, ease: "expo.out" }, T.reveal);
      tl.fromTo("#b-logo", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, T.reveal + 0.05);
      tl.fromTo("#b-word", { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, T.reveal + 0.25);
      // push through the logo into the product
      tl.to("#b-lock", { scale: 6, opacity: 0, duration: 0.45, ease: "power3.in" }, T.demo - 0.42);

      // ---------------------------------------------------------------- DEMO
      // Camera: put design point (px, py) at frame centre at scale s.
      const at = (px, py, s) => ({ x: W / 2 - px * s, y: H / 2 - py * s, scale: s });
      let camState = [720, 512, 0.62];
      function cam(t, dur, to, ease = "power3.inOut") {
        tl.fromTo("#cam", at(...camState), { ...at(...to), duration: dur, ease, immediateRender: false }, t);
        camState = to;
      }
      tl.set("#cam", at(...camState), T.demo);
      // window flies in from depth and lands flat
      tl.fromTo("#tilt", { rotationX: 26, rotationY: -22, z: -200 }, { rotationX: 0, rotationY: 0, z: 0, duration: 1.0, ease: "expo.out", transformPerspective: 2600 }, T.demo);
      cam(T.demo, 1.0, [720, 512, 0.95], "expo.out");

      // screens — each lives in a window; crossfades keep it feeling like one app
      function scr(id, a, z, fade = 0.16) {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: fade, ease: "none", immediateRender: false }, a);
        if (z != null) tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: fade, ease: "none", immediateRender: false }, z);
      }
      scr("#s-home", T.demo, T.processing);
      scr("#s-proc", T.processing, T.docOpen);
      scr("#s-doc", T.docOpen, T.getStarted + 0.1, 0.22);
      scr("#s-gen", T.getStarted + 0.1, T.questions);
      scr("#s-q", T.questions, T.wrongClick + 0.08, 0.1);
      scr("#s-rev", T.wrongClick + 0.08, T.flashTab + 0.08, 0.1);
      scr("#s-fc", T.flashTab + 0.08, T.flip + 0.6);
      scr("#s-fcx", T.flip + 0.6, T.recordCut);
      scr("#s-rs", T.recordCut, T.startRec + 0.1);
      scr("#s-rec", T.startRec + 0.1, T.linkCut);
      scr("#s-home", T.linkCut, T.enter + 0.05);
      scr("#s-link", T.enter + 0.05, T.results, 0.12);
      scr("#s-res", T.results, null);

      // ---- cursor
      let cur = [1180, 900];
      function move(t, dur, x, y, ease = "power2.inOut") {
        tl.fromTo("#cursor", { x: cur[0], y: cur[1] }, { x, y, duration: dur, ease, immediateRender: false }, t);
        cur = [x, y];
      }
      const ripples = document.getElementById("ripples");
      function click(t, x, y) {
        tl.fromTo("#cursor", { scale: 1 }, { scale: 0.82, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, t);
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = x + "px";
        r.style.top = y + "px";
        ripples.appendChild(r);
        tl.fromTo(r, { scale: 0.3, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, t + 0.02);
      }
      tl.set("#cursor", { x: cur[0], y: cur[1] }, T.demo);
      tl.fromTo("#cursor", { opacity: 0 }, { opacity: 1, duration: 0.25 }, T.demo + 0.55);

      // ---- 1. drag the PDF onto Documents
      tl.fromTo("#pdf", { opacity: 0, x: 1500, y: 980, rotation: 14 }, { opacity: 1, x: 1020, y: 760, rotation: -3, duration: 0.6, ease: "expo.out" }, T.demo + 0.25);
      move(T.demo + 0.6, 0.45, 1150, 800, "power2.out");
      click(T.grab, 1150, 800);
      tl.fromTo("#pdf", { scale: 1, rotation: -3 }, { scale: 1.06, rotation: -6, duration: 0.15, ease: "power2.out", immediateRender: false }, T.grab);
      cam(T.grab - 0.1, 1.1, [640, 440, 1.25]);
      tl.fromTo("#pdf", { x: 1020, y: 760 }, { x: 448, y: 296, duration: 0.85, ease: "power2.inOut", immediateRender: false }, T.grab + 0.12);
      move(T.grab + 0.12, 0.85, 578, 336);
      tl.fromTo("#drop", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, T.grab + 0.6);
      tl.fromTo("#pdf", { scale: 1.06, opacity: 1 }, { scale: 0.35, opacity: 0, duration: 0.22, ease: "power3.in", immediateRender: false }, T.drop);
      tl.to("#drop", { opacity: 0, duration: 0.15 }, T.drop + 0.08);
      click(T.drop, 578, 336);

      // ---- 2. processing → the document opens
      cam(T.processing, 0.5, [632, 560, 1.35], "power3.out");
      tl.set("#bar1", { opacity: 1 }, T.processing);
      tl.fromTo("#fill1", { scaleX: 0 }, { keyframes: [{ scaleX: 0.32, duration: 0.45, ease: "power2.out" }, { scaleX: 0.41, duration: 0.35, ease: "none" }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }] }, T.processing + 0.1);
      tl.set("#bar1", { opacity: 0 }, T.docOpen);
      move(T.processing + 0.2, 1.2, 760, 700, "sine.inOut");
      cam(T.docOpen, 0.9, [660, 470, 1.1], "expo.out");

      // ---- 3. generate a quiz
      move(T.docOpen + 0.7, 0.75, 1214, 690);
      cam(T.docOpen + 0.8, 0.9, [1060, 520, 1.2]);
      click(T.getStarted, 1214, 690);
      tl.set("#bar2", { opacity: 1 }, T.getStarted + 0.1);
      tl.fromTo("#fill2", { scaleX: 0 }, { scaleX: 1, duration: 1.05, ease: "power1.inOut" }, T.getStarted + 0.15);
      tl.set("#bar2", { opacity: 0 }, T.questions);
      cam(T.questions - 0.1, 0.7, [1170, 470, 1.55]);

      // ---- 4. pick the wrong answer → it shows you the page
      move(T.questions + 0.2, 0.4, 1250, 620, "power2.out");
      move(T.questions + 0.75, 0.4, 1240, 535);
      move(T.wrongClick - 0.45, 0.38, 1230, 451, "power3.out");
      click(T.wrongClick, 1230, 451);
      tl.fromTo("#tilt", { x: 0 }, { keyframes: [{ x: -9, duration: 0.05 }, { x: 8, duration: 0.06 }, { x: -5, duration: 0.06 }, { x: 0, duration: 0.07 }], immediateRender: false }, T.wrongClick + 0.1);
      cam(T.wrongClick + 0.35, 0.8, [1210, 690, 1.75]);
      move(T.wrongClick + 0.7, 0.55, 1368, 692, "power3.out");
      click(T.pageClick, 1368, 692);
      // whip-pan to the page it came from, with motion blur
      cam(T.whip, 0.62, [626, 616, 1.85], "expo.inOut");
      tl.fromTo("#tilt", { filter: "blur(0px)" }, { keyframes: [{ filter: "blur(7px)", duration: 0.3, ease: "power2.in" }, { filter: "blur(0px)", duration: 0.32, ease: "power2.out" }], immediateRender: false }, T.whip);
      tl.set("#sel", { opacity: 1 }, T.whip + 0.6);
      ["#sel1", "#sel2", "#sel3", "#sel4"].forEach((s, i) => {
        tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power1.inOut" }, T.whip + 0.66 + i * 0.2);
      });
      tl.to("#sel", { opacity: 0, duration: 0.2 }, T.flashTab - 0.25);

      // ---- 5. flashcards: open, then flip
      cam(T.flashTab - 0.55, 0.65, [1150, 330, 1.45]);
      move(T.flashTab - 0.5, 0.42, 1143, 108, "power3.out");
      click(T.flashTab, 1143, 108);
      cam(T.flashTab + 0.25, 0.8, [1212, 610, 1.55]);
      move(T.flashTab + 0.5, 0.6, 1240, 660);
      click(T.flip, 1240, 660);
      tl.set("#flipwrap", { opacity: 1 }, T.flip - 0.02);
      tl.fromTo("#flipcard", { rotationY: 0, scale: 1 }, { keyframes: [{ rotationY: 90, scale: 1.05, duration: 0.3, ease: "power2.in" }, { rotationY: 180, scale: 1, duration: 0.34, ease: "power2.out" }] }, T.flip + 0.02);
      tl.set("#flipwrap", { opacity: 0 }, T.flip + 0.72);
      move(T.flip + 0.8, 0.7, 1080, 848, "power2.inOut");
      cam(T.flip + 0.9, 1.4, [1212, 640, 1.68], "sine.inOut");

      // ---- 6. record a class (time-lapse)
      cam(T.recordCut - 0.05, 0.6, [632, 640, 1.2], "expo.out");
      move(T.recordCut + 0.2, 0.75, 640, 842);
      click(T.startRec, 640, 842);
      cam(T.startRec + 0.15, 0.7, [632, 545, 1.7]);
      tl.set(["#timerpatch", "#wave"], { opacity: 1 }, T.startRec + 0.1);
      const timerEl = document.getElementById("timer");
      const tm = { s: 0 };
      tl.fromTo(
        tm,
        { s: 0 },
        {
          s: 2712,
          duration: T.linkCut - T.startRec - 0.45,
          ease: "power3.in",
          onUpdate: () => {
            const v = Math.floor(tm.s);
            timerEl.textContent = String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
          },
        },
        T.startRec + 0.1
      );
      tl.fromTo("#ff", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, T.startRec + 1.0);
      tl.set(["#timerpatch", "#wave", "#ff"], { opacity: 0 }, T.linkCut);
      const wave = document.getElementById("wave");
      const NB = 38,
        bars = [];
      for (let i = 0; i < NB; i++) {
        const b = document.createElement("div");
        b.className = "b";
        b.style.left = 74 + i * 9.2 + "px";
        wave.appendChild(b);
        bars.push(b);
      }
      const wv = { t: 0 };
      tl.fromTo(
        wv,
        { t: 0 },
        {
          t: 1,
          duration: T.linkCut - T.startRec,
          ease: "none",
          onUpdate: () => {
            const tt = wv.t * (T.linkCut - T.startRec);
            for (let i = 0; i < NB; i++) {
              const a = 0.5 + 0.5 * Math.sin(tt * 9.1 + i * 0.73) * Math.sin(tt * 3.7 + i * 0.31);
              const env = 0.35 + 0.65 * Math.abs(Math.sin(tt * 2.3 + i * 0.12));
              bars[i].style.transform = "scaleY(" + (0.18 + 0.82 * a * env).toFixed(3) + ")";
            }
          },
        },
        T.startRec + 0.1
      );
      move(T.startRec + 0.6, 1.4, 820, 760, "sine.inOut");

      // ---- 7. paste the link you missed (typed)
      cam(T.linkCut - 0.05, 0.6, [840, 470, 1.55], "expo.out");
      move(T.linkCut + 0.05, 0.3, 700, 493, "power3.out");
      click(T.fieldClick, 700, 493);
      tl.set(["#ph", "#typed"], { opacity: 1 }, T.fieldClick + 0.05);
      const typedEl = document.getElementById("typedtext");
      const caretEl = document.getElementById("caret");
      const ty = { n: 0 };
      tl.fromTo(
        ty,
        { n: 0 },
        {
          n: T.url.length,
          duration: T.typeEnd - T.typeStart,
          ease: "none",
          onUpdate: () => {
            typedEl.textContent = T.url.slice(0, Math.floor(ty.n));
          },
        },
        T.typeStart
      );
      const blink = { p: 0 };
      tl.fromTo(
        blink,
        { p: 0 },
        {
          p: 1,
          duration: T.enter - T.fieldClick,
          ease: "none",
          onUpdate: () => {
            const tt = blink.p * (T.enter - T.fieldClick);
            const typing = tt > T.typeStart - T.fieldClick && tt < T.typeEnd - T.fieldClick;
            caretEl.style.opacity = typing || tt % 1.0 < 0.55 ? "1" : "0";
          },
        },
        T.fieldClick
      );
      move(T.fieldClick + 0.15, 0.5, 760, 560, "sine.inOut");
      tl.set(["#ph", "#typed"], { opacity: 0 }, T.enter + 0.05);
      cam(T.enter, 0.6, [880, 500, 1.45]);
      move(T.enter + 0.25, 0.55, 1143, 532, "power3.out");
      click(T.addSource, 1143, 532);

      // ---- 8. come back tomorrow: results + streak
      cam(T.results - 0.05, 0.7, [1100, 420, 1.25], "expo.out");
      move(T.results + 0.2, 0.7, 1250, 360);
      cam(T.results + 0.5, 0.8, [1212, 330, 1.42]);
      tl.fromTo("#dim", { opacity: 0 }, { opacity: 1, duration: 0.25 }, T.modal - 0.05);
      cam(T.modal - 0.15, 0.55, [720, 520, 1.12], "expo.out");
      tl.fromTo("#modal", { opacity: 0, scale: 0.55, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" }, T.modal);
      tl.to("#cursor", { opacity: 0, duration: 0.2 }, T.modal);
      // deterministic confetti burst from the badge
      const COLORS = ["#fa5d19", "#ffc22e", "#3cc46b", "#3a8cff", "#e2408c", "#9b5cff"];
      const conf = document.getElementById("confetti");
      const CN = 34;
      const confs = [];
      for (let i = 0; i < CN; i++) {
        const c = document.createElement("div");
        c.className = "conf";
        c.style.background = COLORS[i % COLORS.length];
        conf.appendChild(c);
        const ang = (-90 + (((i * 137.5) % 180) - 90)) * (Math.PI / 180);
        const sp = 420 + ((i * 53) % 260);
        confs.push({ c, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, rot: (i * 47) % 360, vr: ((i * 29) % 600) - 300 });
      }
      const cf = { t: 0 };
      tl.fromTo(
        cf,
        { t: 0 },
        {
          t: 1.8,
          duration: 1.8,
          ease: "none",
          onUpdate: () => {
            const t = cf.t;
            for (const p of confs) {
              const x = p.vx * t;
              const y = p.vy * t + 520 * t * t;
              p.c.style.opacity = t <= 0 ? 0 : Math.max(0, 1 - t / 1.8).toFixed(3);
              p.c.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(p.rot + p.vr * t).toFixed(1)}deg)`;
            }
          },
        },
        T.modal + 0.08
      );
      cam(T.modal + 0.5, 1.4, [720, 500, 1.24], "sine.inOut");
      // pull back to the window for the outro hand-off
      cam(T.outro - 0.45, 0.45, [720, 512, 0.97], "power3.in");

      // ---------------------------------------------------------------- OUTRO RING
      const ring = document.getElementById("ring");
      const R = 1460;
      tl.fromTo(ring, { z: -R, rotationY: 0 }, { z: -R - 4200, rotationY: -205, duration: T.endHit - T.outro - 0.15, ease: "power3.inOut" }, T.outro);
      tl.fromTo(ring, { scale: 1, opacity: 1 }, { scale: 0.2, opacity: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, T.endHit - 0.3);

      // ---------------------------------------------------------------- END CARD
      tl.fromTo("#e-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, T.endHit);
      tl.fromTo("#e-glow", { opacity: 0, scale: 0.6 }, { opacity: 0.45, scale: 2.1, duration: 1.2, ease: "expo.out" }, T.endHit);
      tl.fromTo("#e-logo", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, T.endHit);
      tl.fromTo("#e-word", { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, T.endHit + 0.2);
      tl.fromTo("#e-t1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.vo["13"] + 0.75);
      tl.fromTo("#e-t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.vo["13"] + 1.45);
      tl.fromTo("#e-cta", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, T.cta);
      tl.fromTo("#e-live", { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, T.cta + 0.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
